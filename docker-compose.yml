services:

  auth-db:
    container_name: auth_postgres_db
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=${DEV_AUTH_DB_USER}
      - POSTGRES_PASSWORD=${DEV_AUTH_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_AUTH_DB_USER} -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth_service
    ports:
      - "8081:8081"
    environment:
      # Service Configuration
      - PORT=8081

      # Database Configuration (separate auth database)
      - DATABASE_URL=jdbc:postgresql://auth-db:5432/auth_db
      - DATABASE_USER=${DEV_AUTH_DB_USER}
      - DATABASE_PASSWORD=${DEV_AUTH_DB_PASSWORD}
      - DATABASE_MAX_POOL_SIZE=10

      # JWT Configuration
      - JWT_SECRET=${DEV_JWT_SECRET}
      - JWT_ISSUER=http://auth-service:8081/
      - JWT_AUDIENCE=http://auth-service:8081/api

      # Application Configuration
      - APP_ENVIRONMENT=${DEV_APP_ENVIRONMENT:-development}
      - ENABLE_SWAGGER=${DEV_ENABLE_SWAGGER:-true}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  telegram-bot-service:
    build:
      context: .
      dockerfile: telegram-bot-service/Dockerfile
    container_name: telegram_bot_service
    environment:
      # Telegram Bot Token (get from @BotFather on Telegram)
      - TELEGRAM_BOT_TOKEN=${DEV_TELEGRAM_BOT_TOKEN}

      # Service URLs
      - AUTH_SERVICE_URL=http://auth-service:8081

    depends_on:
      auth-service:
        condition: service_healthy

    networks:
      - app-network
    restart: unless-stopped

volumes:
  auth-db-data:
    name: auth_db_data


networks:
  app-network:
    driver: bridge
